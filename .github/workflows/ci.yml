name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  dart:
    name: Dart, policy, and web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Verify generated channels
        run: |
          dart run pigeon --input pigeons/network_conditions_api.dart
          dart format lib/src/platform/generated/network_conditions_api.g.dart
          dart run tool/normalize_generated.dart
          git diff --exit-code -- lib/src/platform/generated android/src/main/kotlin darwin/adaptive_network_policy/Sources
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool pigeons example/lib example/test example/integration_test
      - name: Analyze
        run: flutter analyze
      - name: Test policy and monitor
        run: flutter test --coverage
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Build browser demo
        working-directory: example
        run: flutter build web

  android:
    name: Android native implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug
      - name: Run Kotlin mapper tests
        working-directory: example/android
        run: ./gradlew :adaptive_network_policy:testDebugUnitTest --no-daemon

  apple:
    name: Apple native implementation
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Get dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Build macOS example
        working-directory: example
        run: flutter build macos --debug
      - name: Run shared Swift mapper tests
        run: >-
          xcodebuild test
          -workspace example/macos/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build iOS simulator example
        working-directory: example
        run: flutter build ios --simulator --debug
